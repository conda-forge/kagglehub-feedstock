schema_version: 1

context:
  version: "1.0.3"

package:
  name: kagglehub
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kagglehub/kagglehub-${{ version }}.tar.gz
  sha256: 1ce657f17f836992bf9c341d4b203380e33beed336dffff970af10457424778b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - requests
    - certifi >=2026.10.19
    - tqdm
    - packaging
    - pyyaml
    - kagglesdk >=0.1.38,<1.0

tests:
  - python:
      imports:
        - kagglehub
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Access Kaggle resources anywhere
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Kaggle/kagglehub

extra:
  recipe-maintainers:
    - ngam
    - synapticarbors
